<title>s editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* layout: top bar; editor (right-aligned) beside the operation palette; output and stdin below */
:root {
  color-scheme: light;
  --bg: #e9dccb;
  --panel: #f6eee3;
  --paper: #fbf6ef;
  --line: #cdb9a1;
  --ink: #4a3829;
  --muted: #8a7461;
  --accent: #a0522d;
  --accent-ink: #fbf6ef;
  --sel: #e7cfae;
  --shadow: 0 1px 0 #d8c6ae, 0 6px 18px -8px rgba(110, 80, 50, .35);
  --shadow-press: inset 0 1px 3px rgba(110, 80, 50, .25);
  --c-io: #8c2f5c;
  --c-file: #5d4a9c;
  --c-num: #23725a;
  --c-cond: #b4531c;
  --c-list: #2a5f96;
  --c-code: #a12d2d;
  --c-thread: #6e3a8f;
  --c-lit: #3f6f7d;
  --c-brace: #5f7322;
  --c-raw: #8a9450;
  --c-quote: #8a6418;
  --c-interp: #b0472b;
  --c-interp-bg: #f4dcc8;
  --c-lookup: #1f7f86;
  --c-comment: #a39079;
  --c-err: #c0392b;
  --ok: #3d7a3a;
  --font-code: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-ui: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --code-size: 15px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; }
* { box-sizing: border-box; border-radius: 0 !important; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; padding: 10px 16px 12px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mark { font-family: var(--font-code); font-weight: 700; font-size: 22px; letter-spacing: -.02em; color: var(--accent); padding-inline: 4px 8px; }
.mark small { font-family: var(--font-ui); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-left: 6px; }
.grow { flex: 1; }
.btn { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--paper); }
.btn:active { box-shadow: var(--shadow-press); }
.btn[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.kbd { font-family: var(--font-code); font-size: 11px; opacity: .75; margin-left: 6px; }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; color: var(--muted); }
select.btn { padding-right: 6px; }
.seg { display: inline-flex; box-shadow: var(--shadow); }
.seg .btn { box-shadow: none; }
.seg .btn + .btn { border-left: none; }
.seg .btn[aria-pressed="true"] { background: var(--sel); box-shadow: var(--shadow-press); }

/* main area */
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; grid-template-rows: minmax(0, 1fr) minmax(170px, 38%); gap: 10px; min-height: 0; }
.pane { background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; min-width: 0; }

/* file tabs */
.tabs { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--bg); }
.tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-right: 1px solid var(--line); cursor: pointer; font-family: var(--font-code); font-size: 13px; color: var(--muted); white-space: nowrap; background: transparent; border-top: none; border-left: none; border-bottom: none; }
.tab.on { background: var(--paper); color: var(--ink); box-shadow: inset 0 2px 0 var(--accent); }
.tab .x { border: none; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; font-size: 13px; }
.tab .x:hover { color: var(--c-err); }
.tab .confirm { border: 1px solid var(--c-err); background: var(--paper); color: var(--c-err); font-size: 11px; padding: 1px 5px; cursor: pointer; }
.tab input { font-family: var(--font-code); font-size: 13px; width: 11ch; border: 1px solid var(--line); background: var(--paper); padding: 1px 4px; }
.tabs .add { padding: 6px 10px; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 15px; }
.tabs .add:hover { color: var(--accent); }

/* editor */
.ed { position: relative; flex: 1; min-height: 0; background: var(--paper); }
.ed textarea, .ed pre { position: absolute; left: 0; top: 0; margin: 0; padding: 14px 18px 40px; border: 0; font-family: var(--font-code); font-size: var(--code-size); line-height: 1.6; white-space: pre; tab-size: 2; font-variant-ligatures: none; letter-spacing: 0; text-align: right; }
.ed[data-align="left"] textarea, .ed[data-align="left"] pre { text-align: left; }
.ed textarea { width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--accent); overflow: auto; outline: none; z-index: 1; }
.ed textarea::selection { background: rgba(160, 82, 45, .22); color: transparent; }
.ed pre { overflow: hidden; pointer-events: none; color: var(--ink); }
.status { display: flex; gap: 14px; align-items: center; padding: 5px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); min-height: 28px; }
.status .tokinfo { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status code { font-family: var(--font-code); color: var(--ink); }
.pos { font-family: var(--font-code); font-variant-numeric: tabular-nums; }

/* syntax */
.k-word { color: var(--ink); }
.k-numlit { color: var(--c-lit); }
.k-brace { color: var(--c-brace); }
.k-bracedelim { color: var(--c-brace); font-weight: 700; }
.k-raw { color: var(--c-raw); }
.k-interp { color: var(--c-interp); background: var(--c-interp-bg); }
.k-quote { color: var(--c-quote); }
.k-io { color: var(--c-io); font-weight: 700; }
.k-file { color: var(--c-file); font-weight: 700; }
.k-num { color: var(--c-num); font-weight: 700; }
.k-cond { color: var(--c-cond); font-weight: 700; }
.k-list { color: var(--c-list); font-weight: 700; }
.k-code { color: var(--c-code); font-weight: 700; }
.k-thread { color: var(--c-thread); font-weight: 700; }
.k-stem-lookup { color: var(--c-lookup); }
.k-stem-def, .k-stem-call { color: var(--c-code); }
.k-stem-set { color: var(--c-num); }
.k-sfx { font-weight: 700; color: var(--accent); }
.k-sfx-cond { font-weight: 700; color: var(--c-cond); }
[hidden] { display: none !important; }
.k-body { background: rgba(95, 115, 34, .06); }
.k-comment, .k-comment * { color: var(--c-comment) !important; font-style: italic; font-weight: 400 !important; background: none !important; }
.k-err { color: var(--c-err); text-decoration: wavy underline var(--c-err); }

/* palette */
.pal { grid-row: 1 / span 2; grid-column: 2; }
.pal-head { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); background: var(--bg); }
.pal-head input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); padding: 5px 8px; }
.pal-body { overflow-y: auto; flex: 1; padding: 6px 8px 10px; display: flex; flex-direction: column; gap: 10px; }
.grp h3 { margin: 4px 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.grp h3 i { width: 9px; height: 9px; display: inline-block; }
.ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px; }
.op { font-family: var(--font-code); font-size: 14px; font-weight: 700; padding: 7px 2px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; }
.op:hover, .op:focus-visible { background: #fff9f1; transform: translateY(-1px); }
.op:active { box-shadow: var(--shadow-press); transform: none; }
.doc { border-top: 1px solid var(--line); padding: 10px 12px 12px; background: var(--paper); min-height: 112px; font-size: 13px; line-height: 1.45; }
.doc .sig { font-family: var(--font-code); font-size: 14px; margin-bottom: 4px; text-align: right; }
.doc .sig b { color: var(--accent); }
.doc .what { color: var(--ink); }
.doc .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

/* output */
.outpane { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) 240px; }
.out-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.out-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--line); background: var(--bg); }
.out-head .tab { border: none; padding: 4px 10px; font-family: var(--font-ui); font-size: 13px; }
.runinfo { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--font-code); padding-right: 6px; }
.runinfo.bad { color: var(--c-err); }
.runinfo.good { color: var(--ok); }
.out { flex: 1; overflow: auto; margin: 0; padding: 8px 12px 12px; font-family: var(--font-code); font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: var(--paper); }
.out .e { color: var(--c-err); }
.out .w { color: var(--c-comment); }
.state { flex: 1; overflow: auto; padding: 10px 12px; background: var(--paper); display: flex; flex-direction: column; gap: 12px; font-size: 13px; }
.state h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.chip { font-family: var(--font-code); font-size: 12.5px; padding: 2px 7px; background: var(--panel); border: 1px solid var(--line); }
.chip.ow-true { background: #dcebd5; border-color: #a6c79a; }
.chip.ow-false { background: #f1d9cf; border-color: #d9a993; }
.kv { width: 100%; border-collapse: collapse; font-family: var(--font-code); font-size: 12.5px; }
.kv td { border-bottom: 1px solid #eadccb; padding: 2px 6px; vertical-align: top; word-break: break-word; }
.kv td:first-child { color: var(--c-lookup); width: 30%; }
.empty { color: var(--muted); font-style: italic; }
.io { display: flex; flex-direction: column; gap: 8px; padding: 8px 10px; min-height: 0; }
.io label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.io label span { text-transform: none; letter-spacing: 0; font-weight: 400; }
.io textarea, .io input { width: 100%; border: 1px solid var(--line); background: var(--paper); padding: 6px 8px; font-family: var(--font-code); font-size: 13px; }
.io textarea { flex: 1; resize: none; min-height: 60px; }
.hidden-file { display: none; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .main > .pane:first-child .ed { min-height: 52vh; }
  .pal { grid-row: auto; grid-column: 1; max-height: 70vh; }
  .outpane { grid-column: 1; grid-row: auto; grid-template-columns: minmax(0, 1fr); min-height: 340px; }
  .out-main { border-right: none; border-bottom: 1px solid var(--line); min-height: 220px; }
}
@media (prefers-reduced-motion: reduce) { .op:hover { transform: none; } }
</style>

<div class="app">
  <div class="bar">
    <div class="mark">s<small>editor</small></div>
    <button class="btn primary" id="run" title="Run the open file (Ctrl+Enter)">Run<span class="kbd">Ctrl ⏎</span></button>
    <button class="btn" id="stop" disabled>Stop</button>
    <label class="check" for="live"><input type="checkbox" id="live"> live</label>
    <div class="grow"></div>
    <select class="btn" id="examples" aria-label="Open an example">
      <option value="">Open example…</option>
    </select>
    <div class="seg" role="group" aria-label="Text alignment">
      <button class="btn small" id="al-right" aria-pressed="true" title="Right-aligned text">⇥ right</button>
      <button class="btn small" id="al-left" aria-pressed="false" title="Left-aligned text">⇤ left</button>
    </div>
    <div class="seg" role="group" aria-label="Text size">
      <button class="btn small" id="fs-down" title="Smaller text">A−</button>
      <button class="btn small" id="fs-up" title="Larger text">A+</button>
    </div>
    <button class="btn small" id="copy" title="Copy the open file">Copy</button>
    <button class="btn small" id="upload" title="Add .s files from your computer">Add files</button>
    <input type="file" id="file-in" class="hidden-file" multiple accept=".s,.txt,text/plain">
  </div>

  <div class="main">
    <section class="pane">
      <div class="tabs" id="tabs"></div>
      <div class="ed" id="ed" data-align="right">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="s source"></textarea>
      </div>
      <div class="status">
        <span class="tokinfo" id="tokinfo"></span>
        <span class="pos" id="pos">1:1</span>
      </div>
    </section>

    <section class="pane pal" aria-label="Operations">
      <div class="pal-head"><input id="filter" type="search" placeholder="Filter operations" aria-label="Filter operations"></div>
      <div class="pal-body" id="pal"></div>
      <div class="doc" id="doc"></div>
    </section>

    <section class="pane outpane">
      <div class="out-main">
        <div class="out-head">
          <button class="tab on" id="t-out">Output</button>
          <button class="tab" id="t-state">State</button>
          <button class="btn small" id="clear" style="margin-left:6px">Clear</button>
          <span class="runinfo" id="runinfo"></span>
        </div>
        <pre class="out" id="out"></pre>
        <div class="state" id="state" hidden></div>
      </div>
      <div class="io">
        <label for="argv">args <span>list args, argc</span></label>
        <input id="argv" placeholder="saul pretoria">
        <label for="stdin">stdin <span>one line per &lt;_</span></label>
        <textarea id="stdin" spellcheck="false" placeholder="lines read by <_"></textarea>
      </div>
    </section>
  </div>
</div>

<script id="srt">
// s runtime for the browser. Semantics follow src/rt.rs.
var SRT = (function () {
  "use strict";

  class SErr extends Error {}
  class SExit extends Error {
    constructor(code) { super("exit " + code); this.code = code; }
  }

  const enc = new TextEncoder();
  const dec = new TextDecoder("utf-8", { fatal: false });

  const CMDS = {
    ">": "Print", ">_": "PrintRaw", "<": "Shell", "<_": "ReadIn",
    "w": "Write", "+w": "Append", "mv": "Move", "r": "Read", "r@": "ReadAt",
    "?)": "Match", "&&&": "Repeat", "***": "Par",
    "n": "SetN", "+": "Add", "-": "Sub", "*": "Mul", "/": "Div", "^": "Pow", "%": "Mod",
    "!!": "Not", "=": "Eq", "!=": "Ne", ";": "AndNe", "&": "AndEq",
    "==": "NumEq", "<<": "Lt", ">>": "Gt", "<<=": "Le", ">>=": "Ge",
    "l": "LPush", "-l": "LPop", "[l]": "LGet", "l=": "LSet", "l-": "LDel",
    "#l": "LLen", "/l": "Split", "l/": "Join", "#s": "SLen",
    "f": "Open", "+f": "FWriteAt", "@f": "FReadAt", "f-": "FClose",
    "f_": "FWriteLn", "_f": "FReadLn", "?eof": "Eof",
    "t": "Spawn", "-t": "Kill", "<t": "Send", ">t": "Recv",
    "#prng": "PrngN", "`prng": "PrngS",
    "><": "Replace", "//": "Comment", "<-": "Ret", "<--": "Exit",
  };
  const cmdOf = (w) => (Object.prototype.hasOwnProperty.call(CMDS, w) ? CMDS[w] : null);
  const SUFFIX = "?!~$`#;:.";

  const NUM_RE = /^[+-]?(?:(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?|inf|infinity|nan)$/i;

  function strictNum(s) {
    if (!NUM_RE.test(s)) return null;
    const l = s.toLowerCase().replace(/^[+-]/, "");
    const neg = s[0] === "-";
    if (l === "inf" || l === "infinity") return neg ? -Infinity : Infinity;
    if (l === "nan") return NaN;
    return parseFloat(s);
  }
  function parseNum(s) {
    const x = strictNum(s.trim());
    return x === null ? 0 : x;
  }
  function fmtNum(x) {
    if (x === 0) return "0";
    if (Number.isNaN(x)) return "NaN";
    if (x === Infinity) return "inf";
    if (x === -Infinity) return "-inf";
    const s = String(x);
    const e = s.indexOf("e");
    if (e < 0) return s;
    let m = s.slice(0, e), ex = parseInt(s.slice(e + 1), 10);
    let neg = false;
    if (m[0] === "-") { neg = true; m = m.slice(1); }
    let [ip, fp = ""] = m.split(".");
    let digits = ip + fp, point = ip.length + ex;
    let out;
    if (point <= 0) out = "0." + "0".repeat(-point) + digits;
    else if (point >= digits.length) out = digits + "0".repeat(point - digits.length);
    else out = digits.slice(0, point) + "." + digits.slice(point);
    return (neg ? "-" : "") + out;
  }
  function canon(s) {
    const x = strictNum(s);
    if (x === null) return null;
    return fmtNum(x) === s ? x : null;
  }
  const text = (v) => (typeof v === "number" ? fmtNum(v) : v);
  const num = (v) => (typeof v === "number" ? v : parseNum(v));
  function valEq(a, b) {
    if (typeof a === "number" && typeof b === "number" && !Number.isNaN(a) && !Number.isNaN(b)) return a === b;
    return text(a) === text(b);
  }
  function toI64(x) {
    if (Number.isNaN(x)) return 0;
    x = Math.trunc(x);
    if (x > 9223372036854775807) return 9223372036854775807;
    if (x < -9223372036854775808) return -9223372036854775808;
    return x;
  }
  const toU = (x) => Math.max(0, toI64(x));
  const isWs = (c) => c === " " || c === "\n" || c === "\t" || c === "\r";

  // parser

  function classify(w) {
    const c = cmdOf(w);
    if (c) return { k: "cmd", c };
    const cs = Array.from(w);
    const last = cs[cs.length - 1];
    const stem = cs.slice(0, -1).join("");
    if (stem.length > 0 && SUFFIX.includes(last)) {
      switch (last) {
        case "?": return { k: "cond", t: true, op: classify(stem) };
        case "!": return { k: "cond", t: false, op: classify(stem) };
        case "~": return { k: "lookup", s: stem };
        case "$": return { k: "def", s: stem };
        case "`": return { k: "setmem", s: stem };
        case "#": return { k: "setnum", s: stem };
        case ";": return { k: "inc", s: stem };
        case ":": return { k: "dec", s: stem };
        case ".":
          if (stem.length > 1 && stem.endsWith(".")) return { k: "callpass", s: stem.slice(0, -1) };
          return { k: "call", s: stem };
      }
    }
    return { k: "word", t: w };
  }

  function brace(cs, i) {
    const n = cs.length;
    let depth = 1, j = i + 1, parts = [], cur = "";
    while (j < n) {
      const c = cs[j];
      if (c === "{") { depth++; cur += c; j++; }
      else if (c === "}") {
        depth--;
        if (depth === 0) { if (cur) parts.push({ t: cur }); return [parts, j + 1]; }
        cur += c; j++;
      } else if (c === "~" && depth === 1) {
        let k = j + 1;
        while (k < n && cs[k] !== "~" && cs[k] !== "{" && cs[k] !== "}" && !isWs(cs[k])) k++;
        if (k < n && cs[k] === "~") {
          if (k === j + 1) cur += "~";
          else {
            if (cur) { parts.push({ t: cur }); cur = ""; }
            parts.push({ v: cs.slice(j + 1, k).join("") });
          }
          j = k + 1;
        } else { cur += "~"; j++; }
      } else { cur += c; j++; }
    }
    throw new SErr("unclosed {");
  }

  function litOp(prefix, parts) {
    const ps = [];
    for (const p of [{ t: prefix }, ...parts]) {
      if (p.t !== undefined) {
        if (p.t === "") continue;
        const last = ps[ps.length - 1];
        if (last && last.t !== undefined) last.t += p.t;
        else ps.push({ t: p.t });
      } else ps.push(p);
    }
    if (ps.every((p) => p.t !== undefined)) return { k: "push", v: ps.length ? ps[0].t : "" };
    return { k: "interp", parts: ps };
  }

  function parse(src) {
    const cs = Array.from(src);
    const n = cs.length;
    const ops = [];
    let i = 0;
    while (i < n) {
      if (isWs(cs[i])) { i++; continue; }
      let word = "", done = false;
      while (i < n && !isWs(cs[i])) {
        const c = cs[i];
        if (c === "{") {
          const [parts, j] = brace(cs, i);
          ops.push(litOp(word, parts));
          word = ""; i = j; done = true; break;
        } else if (c === "'") {
          let j = i + 1;
          while (j < n && cs[j] !== "'") j++;
          if (j >= n) throw new SErr("unclosed '");
          ops.push({ k: "push", v: word + cs.slice(i + 1, j).join("") });
          word = ""; i = j + 1; done = true; break;
        } else { word += c; i++; }
      }
      if (!done && word) ops.push(classify(word));
    }
    return ops;

  while (o && (o.k === "cond")) { segs.unshift({ from: end - 1, to: end, k: "sfx-cond" }); end--; o = o.op; }
  const inner = { lookup: ["stem-lookup", 1], def: ["stem-def", 1], setmem: ["stem-set", 1], setnum: ["stem-set", 1], inc: ["stem-set", 1], dec: ["stem-set", 1], call: ["stem-call", 1], callpass: ["stem-call", 2] }[o.k];
  if (inner) {
    segs.unshift({ from: end - inner[1], to: end, k: "sfx" });
    segs.unshift({ from, to: end - inner[1], k: inner[0] });
  } else if (o.k === "cmd") segs.unshift({ from, to: end, k: GROUP_OF.get(o.c && Object.keys(SRT.CMDS).find((k) => SRT.CMDS[k] === o.c)) || "code" });
  else segs.unshift({ from, to: end, k: SRT.canon(w.slice(0, end - from)) !== null ? "numlit" : "word" });
  t.segs = segs;
  return t;
}

function render() {
  const src = ta.value;
  const toks = lex(src);
  let html = "", at = 0;
  for (const t of toks) {
    if (t.from > at) html += esc(src.slice(at, t.from));
    let inner = "", p = t.from;
    for (const s of t.segs) {
      if (s.from > p) inner += esc(src.slice(p, s.from));
      inner += `<span class="k-${s.k}">${esc(src.slice(s.from, s.to))}</span>`;
      p = s.to;
    }
    if (t.to > p) inner += esc(src.slice(p, t.to));
    html += t.comment ? `<span class="k-comment">${inner}</span>` : t.kind === "brace" ? `<span class="k-body">${inner}</span>` : inner;
    at = t.to;
  }
  html += esc(src.slice(at)) + "\n ";
  hl.innerHTML = html;
  syncBox();
  lastToks = toks;
  readout();
}
let lastToks = [];
function syncBox() {
  hl.style.width = ta.clientWidth + "px";
  hl.style.height = ta.clientHeight + "px";
  hl.scrollTop = ta.scrollTop;
  hl.scrollLeft = ta.scrollLeft;
}

// token readout under the caret

function describe(t) {
  if (t.kind === "err") return `<code>${esc(t.msg)}</code> — close it before running`;
  if (t.comment) return `comment text, cleared by <code>//</code>`;
  if (t.kind === "brace") {
    const vars = t.interps.map((s) => s.name);
    return "brace literal" + (vars.length ? ` · interpolates ${vars.map((v) => `<code>${esc(v)}</code>`).join(", ")}` : "");
  }
  if (t.kind === "quote") return "quote literal · raw text";
  if (t.kind === "num") return `number literal <code>${esc(t.word)}</code>`;
  if (t.kind === "word") return `literal word <code>${esc(t.word)}</code> · pushed as text`;
  if (t.kind === "cmd") { const c = CMDINFO.get(t.word); return c ? `<code>${esc(c.sig)}</code> — ${esc(c.d)}` : ""; }
  const parts = [];
  let o = t.op;
  while (o.k === "cond") { parts.push(o.t ? "when ow is true:" : "when ow is false:"); o = o.op; }
  const n = (s) => `<code>${esc(s)}</code>`;
  const what = {
    lookup: () => `look up ${n(o.s)} and dispatch it`,
    def: () => `define script ${n(o.s)} from the stack`,
    setmem: () => `mem[${n(o.s)}] = the stack`,
    setnum: () => `numbers[${n(o.s)}] = first value`,
    inc: () => `numbers[${n(o.s)}] += first value or 1`,
    dec: () => `numbers[${n(o.s)}] −= first value or 1`,
    call: () => `call ${n(o.s)} (one value on the stack = repeat count)`,
    callpass: () => `call ${n(o.s)} once on the current stack`,
    cmd: () => { const w = Object.keys(SRT.CMDS).find((k) => SRT.CMDS[k] === o.c); const c = CMDINFO.get(w); return c ? `${n(c.sig)} — ${esc(c.d)}` : ""; },
    word: () => `push ${n(t.word.slice(0, t.word.length - parts.length))}`,
  }[o.k];
  return parts.join(" ") + " " + (what ? what() : "");
}
function readout() {
  const p = ta.selectionStart;
  const before = ta.value.slice(0, p);
  const line = before.split("\n").length;
  const col = p - before.lastIndexOf("\n");
  $("pos").textContent = `${line}:${col}`;
  let t = lastToks.find((t) => p >= t.from && p <= t.to), depth = 0;
  while (t && t.kind === "brace") {
    const h = t.interps.find((s) => p >= s.from && p <= s.to);
    if (h) { $("tokinfo").innerHTML = `interpolates <code>${esc(h.name)}</code> when the literal is evaluated`; return; }
    const u = t.inner.find((x) => p >= x.from && p <= x.to);
    if (!u || p === t.from || p === t.to) break;
    t = u; depth++;
  }
  $("tokinfo").innerHTML = t ? (depth ? `<span style="color:var(--c-brace)">in {…} ×${depth}</span> · ` : "") + describe(t) : "";
}

// editing

function insertText(text, selFrom, selTo) {
  ta.focus();
  const s = ta.selectionStart;
  let ok = false;
  try { ok = document.execCommand("insertText", false, text); } catch (e) {}
  if (!ok) { ta.setRangeText(text, s, ta.selectionEnd, "end"); onEdit(); }
  if (selFrom !== undefined) ta.setSelectionRange(s + selFrom, s + selTo);
}
const isWsAt = (i) => i < 0 || i >= ta.value.length || SRT.isWs(ta.value[i]);
function insertWord(w) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const pre = isWsAt(s - 1) ? "" : " ";
  const post = isWsAt(e) ? "" : " ";
  insertText(pre + w + post, pre.length + w.length + post.length, pre.length + w.length + post.length);
}
function insertSuffix(x) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s !== e) { insertText(ta.value.slice(s, e) + x); return; }
  const prev = ta.value[s - 1];
  if (s > 0 && !SRT.isWs(prev) && prev !== "}" && prev !== "'") { insertText(x); return; }
  const pre = isWsAt(s - 1) ? "" : " ";
  insertText(pre + "name" + x, pre.length, pre.length + 4);
}
function insertTemplate(kind) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  if (kind === "interp") { insertText("~name~", 1, 5); return; }
  if (kind.startsWith("raw:")) { insertText(kind.slice(4)); return; }
  const [o, c] = kind === "brace" ? ["{", "}"] : ["'", "'"];
  const pre = sel || isWsAt(s - 1) ? "" : " ";
  insertText(pre + o + sel + c, pre.length + 1, pre.length + 1 + sel.length);
}

let liveTimer = 0;
function onEdit() {
  const f = cur();
  if (f) f[1] = ta.value;
  save();
  render();
  if (S.live) { clearTimeout(liveTimer); liveTimer = setTimeout(() => run(true), 380); }
}
ta.addEventListener("input", onEdit);
ta.addEventListener("scroll", syncBox);
["keyup", "click", "select"].forEach((ev) => ta.addEventListener(ev, readout));
document.addEventListener("selectionchange", () => { if (document.activeElement === ta) readout(); });
let escPressed = false;
ta.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(false); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); flash("Saved in this browser"); return; }
  if (e.key === "Escape") { escPressed = true; return; }
  if (e.key === "Tab" && !escPressed && !e.shiftKey) { e.preventDefault(); insertText("  "); }
  if (e.key === "{" && ta.selectionStart !== ta.selectionEnd) { e.preventDefault(); insertTemplate("brace"); }
  if (e.key === "'" && ta.selectionStart !== ta.selectionEnd) { e.preventDefault(); insertTemplate("quote"); }
  escPressed = false;
});
new ResizeObserver(syncBox).observe(ta);

// tabs

function renderTabs() {
  const box = $("tabs");
  box.innerHTML = "";
  for (const [p] of S.files) {
    const t = document.createElement("div");
    t.className = "tab" + (p === S.active ? " on" : "");
    t.setAttribute("role", "button");
    t.tabIndex = 0;
    const name = document.createElement("span");
    name.textContent = p;
    t.append(name);
    t.title = "Open " + p + " · double-click to rename";
    t.onclick = () => openFile(p);
    t.onkeydown = (e) => { if (e.key === "Enter") openFile(p); };
    t.ondblclick = () => renameTab(t, p);
    if (S.files.length > 1) {
      const x = document.createElement("button");
      x.className = "x"; x.textContent = "×"; x.title = "Delete " + p;
      x.onclick = (e) => {
        e.stopPropagation();
        const c = document.createElement("button");
        c.className = "confirm"; c.textContent = "delete";
        c.onclick = (ev) => { ev.stopPropagation(); S.files.splice(fileIdx(p), 1); if (S.active === p) S.active = S.files[0][0]; save(); renderTabs(); loadActive(); };
        x.replaceWith(c);
        setTimeout(() => { if (c.isConnected) c.replaceWith(x); }, 3000);
      };
      t.append(x);
    }
    box.append(t);
  }
  const add = document.createElement("button");
  add.className = "add"; add.textContent = "+"; add.title = "New file";
  add.onclick = () => newTab(add);
  box.append(add);
}
function nameInput(initial, done) {
  const i = document.createElement("input");
  i.value = initial;
  i.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); done(i.value.trim()); }
    if (e.key === "Escape") renderTabs();
  };
  i.onblur = () => done(i.value.trim());
  return i;
}
function newTab(btn) {
  let n = 1; while (fileIdx(`new${n}.s`) >= 0) n++;
  const i = nameInput(`new${n}.s`, (v) => {
    if (v && fileIdx(v) < 0) { S.files.push([v, ""]); S.active = v; save(); }
    renderTabs(); loadActive();
  });
  btn.replaceWith(i); i.focus(); i.select();
}
function renameTab(t, p) {
  const i = nameInput(p, (v) => {
    if (v && v !== p && fileIdx(v) < 0) { S.files[fileIdx(p)][0] = v; if (S.active === p) S.active = v; save(); }
    renderTabs();
  });
  t.replaceWith(i); i.focus(); i.select();
}
function openFile(p) { S.active = p; save(); renderTabs(); loadActive(); }
function loadActive() { ta.value = cur()[1]; ta.scrollTop = 0; render(); }

// palette

function opButton(label, title, onClick, onShow, color) {
  const b = document.createElement("button");
  b.className = "op"; b.textContent = label; b.title = title;
  if (color) b.style.color = `var(${color})`;
  b.onclick = onClick;
  b.onmouseenter = onShow; b.onfocus = onShow;
  return b;
}
function showDoc(sig, d, hint) {
  const parts = sig.split(" ");
  const last = parts.pop();
  $("doc").innerHTML = `<div class="sig">${esc(parts.join(" "))} <b>${esc(last)}</b></div><div class="what">${esc(d)}</div>` + (hint ? `<div class="hint">${esc(hint)}</div>` : "");
}
function buildPalette() {
  const pal = $("pal");
  const q = $("filter").value.trim().toLowerCase();
  const match = (...xs) => !q || xs.some((x) => x && x.toLowerCase().includes(q));
  pal.innerHTML = "";
  const group = (title, color, items) => {
    if (!items.length) return;
    const g = document.createElement("div"); g.className = "grp";
    g.innerHTML = `<h3><i style="background:var(${color})"></i>${esc(title)}</h3>`;
    const ops = document.createElement("div"); ops.className = "ops";
    items.forEach((b) => ops.append(b));
    g.append(ops); pal.append(g);
  };
  group("literals", "--c-brace", LITS.filter((l) => match(l.w, l.d)).map((l) =>
    opButton(l.w, l.d, () => insertTemplate(l.ins), () => showDoc(l.sig, l.d, l.hint), "--c-brace")));
  group("suffix forms on a name", "--accent", SFX.filter((s) => match(s.w, s.d, s.sig)).map((s) =>
    opButton(s.w, s.d, () => insertSuffix(s.w), () => showDoc(s.sig, s.d, (s.hint ? s.hint + " " : "") + "Click after a word to append; elsewhere inserts name" + s.w + "."), s.cond ? "--c-cond" : "--accent")));
  for (const [g, [title, color]] of Object.entries(G)) {
    group(title, color, CMDDOC.filter(([gg, w, sig, d]) => gg === g && match(w, d, sig, title)).map(([gg, w, sig, d, hint]) =>
      opButton(w, sig + " — " + d, () => insertWord(w), () => showDoc(sig, d, hint), color)));
  }
  if (!pal.children.length) pal.innerHTML = `<p class="empty">No operation matches “${esc(q)}”.</p>`;
}
$("filter").addEventListener("input", buildPalette);

// running

let worker = null, runTimer = 0, runStart = 0, outBuf = "", outCap = 400000;
const out = $("out");
let workerURL = null;
function makeWorker() {
  if (!workerURL) {
    const glue = `
      const enc = new TextEncoder(), dec = new TextDecoder();
      self.onmessage = (e) => {
        const { files, path, argv, stdin } = e.data;
        const vfs = new Map(files.map(([p, t]) => [p, enc.encode(t)]));
        let buf = "", n = 0, last = performance.now(), changed = false;
        const flush = () => { if (buf) { postMessage({ t: "out", s: buf }); buf = ""; } };
        const host = {
          vfs, stdin,
          out(s) { buf += s; if (buf.length > 32768) flush(); },
          err(s) { flush(); postMessage({ t: "err", s }); },
          tick() { if ((++n & 4095) === 0) { const t = performance.now(); if (t - last > 60) { flush(); last = t; } } },
          changed() { changed = true; },
        };
        let r;
        try { r = SRT.run(host, path, argv); }
        catch (err) { r = { code: 1, error: "internal: " + (err && err.message || err), state: null }; }
        flush();
        postMessage({ t: "done", code: r.code, error: r.error, state: r.state,
          files: changed ? [...vfs].map(([p, b]) => [p, dec.decode(b)]) : null });
      };`;
    workerURL = URL.createObjectURL(new Blob([$("srt").textContent, glue], { type: "text/javascript" }));
  }
  return new Worker(workerURL);
}
function parseArgv(s) {
  const out = []; let cur = null, q = null;
  for (const c of s) {
    if (q) { if (c === q) q = null; else cur += c; continue; }
    if (c === "'" || c === '"') { q = c; if (cur === null) cur = ""; continue; }
    if (/\s/.test(c)) { if (cur !== null) { out.push(cur); cur = null; } continue; }
    cur = (cur || "") + c;
  }
  if (cur !== null) out.push(cur);
  return out;
}
function appendOut(s, cls) {
  outBuf += s;
  if (outBuf.length > outCap) { outBuf = outBuf.slice(-outCap); out.textContent = "… earlier output trimmed\n" + outBuf; return; }
  const atBottom = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
  if (cls) { const sp = document.createElement("span"); sp.className = cls; sp.textContent = s; out.append(sp); }
  else out.append(document.createTextNode(s));
  if (atBottom) out.scrollTop = out.scrollHeight;
}
function setRunning(on) {
  $("run").disabled = on; $("stop").disabled = !on;
}
function info(text, cls) { const r = $("runinfo"); r.textContent = text; r.className = "runinfo" + (cls ? " " + cls : ""); }
function stop(msg) {
  if (!worker) return;
  worker.terminate(); worker = null; clearInterval(runTimer); setRunning(false);
  appendOut("\n" + msg, "w");
  info("stopped · " + Math.round(performance.now() - runStart) + " ms", "bad");
}
function run(live) {
  if (worker) { worker.terminate(); worker = null; clearInterval(runTimer); }
  out.textContent = ""; outBuf = "";
  const w = makeWorker();
  worker = w;
  runStart = performance.now();
  setRunning(true);
  info(live ? "live run…" : "running…");
  runTimer = setInterval(() => {
    const el = performance.now() - runStart;
    if (live && el > 1500) { stop("stopped: live runs are limited to 1.5 s; press Run for an unlimited run"); return; }
    info("running · " + (el / 1000).toFixed(1) + " s");
  }, 200);
  w.onmessage = (e) => {
    const m = e.data;
    if (w !== worker) return;
    if (m.t === "out") appendOut(m.s);
    else if (m.t === "err") appendOut(m.s, "e");
    else if (m.t === "done") {
      clearInterval(runTimer); worker = null; setRunning(false); w.terminate();
      const ms = Math.round(performance.now() - runStart);
      if (m.error) appendOut("\ns: " + m.error, "e");
      info(`exit ${m.code} · ${ms} ms`, m.code === 0 ? "good" : "bad");
      if (m.state) renderState(m.state);
      if (m.files) applyFiles(m.files);
    }
  };
  w.onerror = (e) => { e.preventDefault(); if (w === worker) { appendOut("\nThe runner failed: " + e.message, "e"); clearInterval(runTimer); worker = null; setRunning(false); info("failed", "bad"); } };
  w.postMessage({ files: S.files, path: S.active, argv: parseArgv(S.argv), stdin: S.stdin ? S.stdin.split("\n") : [] });
}
function applyFiles(files) {
  const was = cur()[1];
  S.files = files;
  if (fileIdx(S.active) < 0) S.active = S.files[0] ? S.files[0][0] : "main.s";
  if (!S.files.length) S.files.push(["main.s", ""]);
  save(); renderTabs();
  if (cur()[1] !== was) loadActive();
}
function renderState(st) {
  const box = $("state");
  const table = (rows) => rows.length ? `<table class="kv">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>` : `<div class="empty">empty</div>`;
  box.innerHTML =
    `<div><h4>stack (top at right)</h4><div class="chips">${st.stack.length ? st.stack.map((v) => `<span class="chip">${esc(v) || "&nbsp;"}</span>`).join("") : `<span class="empty">empty</span>`}</div></div>` +
    `<div><h4>ow</h4><span class="chip ow-${st.ow}">${st.ow}</span></div>` +
    `<div><h4>numbers</h4>${table(st.nums)}</div>` +
    `<div><h4>mem</h4>${table(st.mem)}</div>` +
    `<div><h4>lists</h4>${table(st.lists.map(([k, l]) => [k, "[" + l.join(", ") + "]"]))}</div>` +
    `<div><h4>scripts</h4>${st.scripts.length ? `<div class="chips" style="justify-content:flex-start">${st.scripts.map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>` : `<div class="empty">none</div>`}</div>` +
    (st.repl.length ? `<div><h4>replacements</h4>${table(st.repl)}</div>` : "");
}
$("run").onclick = () => run(false);
$("stop").onclick = () => stop("stopped by you");
$("clear").onclick = () => { out.textContent = ""; outBuf = ""; info(""); };
$("t-out").onclick = () => { $("t-out").classList.add("on"); $("t-state").classList.remove("on"); out.hidden = false; $("state").hidden = true; };
$("t-state").onclick = () => { $("t-state").classList.add("on"); $("t-out").classList.remove("on"); out.hidden = true; $("state").hidden = false; };

// settings and io

function applySettings() {
  ed.dataset.align = S.align;
  $("al-right").setAttribute("aria-pressed", S.align === "right");
  $("al-left").setAttribute("aria-pressed", S.align === "left");
  document.documentElement.style.setProperty("--code-size", S.size + "px");
  $("live").checked = !!S.live;
  requestAnimationFrame(syncBox);
}
$("al-right").onclick = () => { S.align = "right"; save(); applySettings(); };
$("al-left").onclick = () => { S.align = "left"; save(); applySettings(); };
$("fs-down").onclick = () => { S.size = Math.max(11, S.size - 1); save(); applySettings(); };
$("fs-up").onclick = () => { S.size = Math.min(26, S.size + 1); save(); applySettings(); };
$("live").onchange = (e) => { S.live = e.target.checked; save(); if (S.live) run(true); };
$("stdin").value = S.stdin; $("argv").value = S.argv;
$("stdin").oninput = (e) => { S.stdin = e.target.value; save(); };
$("argv").oninput = (e) => { S.argv = e.target.value; save(); };
function flash(t) { info(t); setTimeout(() => { if ($("runinfo").textContent === t) info(""); }, 1600); }
$("copy").onclick = () => {
  const t = ta.value;
  navigator.clipboard.writeText(t).then(() => flash("Copied " + S.active), () => { ta.focus(); ta.select(); flash("Selected, press Ctrl+C"); });
};
$("upload").onclick = () => $("file-in").click();
$("file-in").onchange = async (e) => {
  for (const f of e.target.files) {
    const t = await f.text();
    const i = fileIdx(f.name);
    if (i >= 0) S.files[i][1] = t; else S.files.push([f.name, t]);
    S.active = f.name;
  }
  e.target.value = "";
  save(); renderTabs(); loadActive();
};
for (const ex of EXAMPLES) {
  const o = document.createElement("option");
  o.value = ex.id; o.textContent = ex.name;
  $("examples").append(o);
}
$("examples").onchange = (e) => {
  const ex = EXAMPLES.find((x) => x.id === e.target.value);
  e.target.value = "";
  if (!ex) return;
  for (const [p, t] of ex.files) {
    const i = fileIdx(p);
    if (i >= 0) S.files[i][1] = t; else S.files.push([p, t]);
  }
  S.active = ex.files[0][0];
  if (ex.argv !== undefined) { S.argv = ex.argv; $("argv").value = ex.argv; }
  if (ex.stdin !== undefined) { S.stdin = ex.stdin; $("stdin").value = ex.stdin; }
  save(); renderTabs(); loadActive(); run(false);
};

applySettings();
renderTabs();
loadActive();
buildPalette();
showDoc("value x~", SFX[0].d, "Hover an operation to read it here; click to insert it at the caret.");
document.fonts && document.fonts.ready.then(syncBox);
run(false);
</script>
